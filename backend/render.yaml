services:
  - type: web
    name: qr-menu-api
    env: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: CLOUDINARY_FOLDER
        value: qr-menu/menu-items
      - key: MAX_IMAGE_UPLOAD_MB
        value: 5
      - key: FRONTEND_PUBLIC_BASE_URL
        sync: false
      - key: BACKEND_CORS_ORIGINS
        sync: false
      - key: BACKEND_CORS_ORIGIN_REGEX
        value: "https://.*\\.vercel\\.app"
      - key: BACKEND_ALLOWED_HOSTS
        sync: false
      - key: SUPABASE_POSTGREST_TIMEOUT_SECONDS
        value: 2.5
      - key: PUBLIC_MENU_CACHE_TTL_SECONDS
        value: 120
      - key: PUBLIC_MENU_STALE_SECONDS
        value: 900
      - key: PUBLIC_MENU_CACHE_MAX_SIZE
        value: 512
      - key: PUBLIC_MENU_SINGLEFLIGHT_WAIT_SECONDS
        value: 2.2
